<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos Souvenirs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
h1{color:#ff7a00;text-align:center;padding:28px 16px 12px;font-size:1.7rem}
.hide{display:none!important}
.bg{position:fixed;inset:0;z-index:0;background:#000}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;animation:zoom 14s ease-in-out infinite alternate}
.bg img.on{opacity:1}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 40%,rgba(0,0,0,.7))}
#login{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;overflow:auto;padding:20px 0}
#login h1{padding:0 16px 20px;text-shadow:0 2px 10px #000}
.box{max-width:360px;margin:0 auto;padding:0 20px;text-align:center}
input[type=password],input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid #ff7a00;background:#111;color:#fff;font-size:1.1rem;text-align:center}
button{background:#ff7a00;color:#000;border:0;border-radius:10px;padding:13px 18px;font-size:1rem;font-weight:700;margin-top:12px;width:100%}
button.sec{background:#222;color:#ff7a00}
#msg{color:#ffb066;margin-top:12px;min-height:1.2em}
.bar{display:flex;gap:8px;padding:0 10px 10px}
.bar button{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.cell{position:relative;aspect-ratio:1;background:#111}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.cell .x{position:absolute;top:3px;right:3px;width:26px;height:26px;padding:0;margin:0;border-radius:50%;background:rgba(0,0,0,.7);color:#ff7a00;font-size:14px}
#view{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9}
#view img,#view video{max-width:100%;max-height:100%}
</style>
</head>
<body>
<h1 id="title" class="hide">Bienvenue sur Photos Souvenirs</h1>

<div class="bg" id="bg"></div><div class="shade" id="shade"></div>
<div id="login">
  <h1>Bienvenue sur Photos Souvenirs</h1>
  <div class="box">
    <p style="margin-bottom:14px">Entre ton code personnel</p>
    <input type="password" id="code" placeholder="Ton code (6 caractères minimum)" autocomplete="off">
    <button id="go">Entrer</button>
    <button class="sec hide" id="create">Créer mon espace avec ce code</button>
    <p id="msg"></p>
  </div>
</div>

<div id="space" class="hide">
  <div class="bar">
    <button id="add">+ Ajouter</button>
    <button class="sec" id="out">Quitter</button>
  </div>
  <input type="file" id="file" accept="image/*,video/*" multiple class="hide">
  <p id="info" style="text-align:center;color:#ffb066;min-height:1.2em"></p>
  <div class="grid" id="grid"></div>
</div>

<div id="view" class="hide"></div>

var bg = $("bg");
pics.forEach(function(p,i){var im=document.createElement("img");im.src=p;if(i==0)im.className="on";bg.appendChild(im)});
var cur = 0;
var timer = setInterval(function(){var l=bg.children;l[cur].className="";cur=(cur+1)%l.length;l[cur].className="on"},5000);

function mail(c){ return c.trim().toLowerCase() + "@photossouvenirs.com"; }
function msg(m){ $("msg").textContent = m; }

async function enter(){
  var c = $("code").value;
  if (c.trim().length < 6) { msg("Le code doit avoir au moins 6 caractères."); return; }
  msg("Connexion…");
  var r = await sb.auth.signInWithPassword({email: mail(c), password: c.trim()});
  if (r.error) { msg("Code inconnu. Tu peux créer ton espace avec ce code."); $("create").classList.remove("hide"); return; }
  start(r.data.user);
}
async function create(){
  var c = $("code").value;
  msg("Création…");
  var r = await sb.auth.signUp({email: mail(c), password: c.trim()});
  if (r.error) { msg("Impossible : " + r.error.message); return; }
  if (!r.data.session) { msg("Espace créé. Touche Entrer."); return; }
  start(r.data.user);
}
function start(u){
  uid = u.id;
  $("login").classList.add("hide");$("bg").classList.add("hide");$("shade").classList.add("hide");$("title").classList.remove("hide");clearInterval(timer);
  $("space").classList.remove("hide");
  load();
}
async function load(){
  var l = await sb.storage.from("photos").list(uid, {limit:300, sortBy:{column:"created_at", order:"desc"}});
  var files = (l.data||[]).filter(function(f){return f.name && f.id});
  $("grid").innerHTML = "";
  if (!files.length) { $("info").textContent = "Ton espace est vide. Touche + Ajouter."; return; }
  $("info").textContent = "";
  var paths = files.map(function(f){return uid + "/" + f.name});
  var s = await sb.storage.from("photos").createSignedUrls(paths, 3600);
  (s.data||[]).forEach(function(o){
    if (!o.signedUrl) return;
    var isVid = /\.(mp4|mov|webm|3gp|mkv)$/i.test(o.path);
    var d = document.createElement("div"); d.className = "cell";
    d.innerHTML = (isVid ? '<video preload="metadata" muted src="'+o.signedUrl+'#t=0.1"></video>' : '<img loading="lazy" src="'+o.signedUrl+'">') + '<button class="x">✕</button>';
    d.querySelector(".x").onclick = function(e){ e.stopPropagation(); del(o.path); };
    d.onclick = function(){ show(o.signedUrl, isVid); };
    $("grid").appendChild(d);
  });
}
function show(u, v){
  var w = $("view");
  w.innerHTML = v ? '<video controls autoplay src="'+u+'"></video>' : '<img src="'+u+'">';
  w.classList.remove("hide");
  w.onclick = function(){ w.classList.add("hide"); w.innerHTML = ""; };
}
async function del(p){
  if (!confirm("Supprimer cet élément ?")) return;
  await sb.storage.from("photos").remove([p]);
  load();
}
async function upload(files){
  for (var i=0;i<files.length;i++){
    var f = files[i];
    $("info").textContent = "Envoi " + (i+1) + "/" + files.length + "…";
    var name = Date.now() + "_" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    var r = await sb.storage.from("photos").upload(uid + "/" + name, f);
    if (r.error) { $("info").textContent = "Erreur : " + r.error.message; return; }
  }
  load();
}
$("go").onclick = enter;
$("create").onclick = create;
$("add").onclick = function(){ $("file").click(); };
$("file").onchange = function(e){ upload(e.target.files); e.target.value = ""; };
$("out").onclick = async function(){ await sb.auth.signOut(); location.reload(); };
</script>
